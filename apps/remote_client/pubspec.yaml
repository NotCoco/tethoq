name: universal_agent_remote
version: 0.1.0+1
publish_to: none
description: Provider-neutral mobile and desktop remote control for coding agents.

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  file_selector: ^1.1.0
  flutter_secure_storage: ^10.3.1
  flutter_markdown_plus: ^1.0.12
  image: ^4.9.1
  record: ^7.1.1
  mobile_scanner: ^7.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - LICENSE.flutter
